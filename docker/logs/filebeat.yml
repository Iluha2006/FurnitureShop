filebeat.inputs:
  - type: container
    paths:
      - /var/lib/docker/containers/*/*-json.log
    json.keys_under_root: true

processors:
  - add_docker_metadata:
      host: unix:///var/run/docker.sock

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
logging.to_files: false
logging.to_stderr: true