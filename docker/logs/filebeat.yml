filebeat.inputs:
    - type: container
      enabled: true
      paths:
          - '/var/lib/docker/containers/*/*.log'

    - type: filestream
      id: elasticsearch-logs
      enabled: true
      paths:
          - '/usr/share/elasticsearch/logs/*.log'
      fields:
          log_type: elasticsearch
      fields_under_root: true

processors:
    - add_docker_metadata:
          host: 'unix:///var/run/docker.sock'

output.logstash:
    hosts: ['logstash:5044']
