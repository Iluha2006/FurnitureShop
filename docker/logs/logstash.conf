input {
    beats {
        port => 5044
    }
}

filter {
    mutate {
        add_field => { "application" => "archiweb" }
    }

    if [container][name] {
        mutate {
            copy => { "[container][name]" => "container_name" }
        }
    }

    if [message] =~ /GET|POST|PUT|DELETE|PATCH|HEAD/ {
        grok {
            match => { "message" => "%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}\" %{INT:status} %{INT:bytes} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" }
            break_on_match => true
        }
        date {
            match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
            target => "@timestamp"
        }
        if [status] {
            mutate {
                convert => { "status" => "integer" }
            }
        }
    }
}

output {
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "archiweb-app-logs-%{+YYYY.MM.dd}"
        template => "/usr/share/logstash/config/elasticsearch-template.json"
        template_name => "archiweb-app-logs"
        template_overwrite => true
    }
}