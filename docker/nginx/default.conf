server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Dev: always revalidate static assets, otherwise rebuilds stay hidden by the
    # browser cache. For production use `expires 30d; add_header Cache-Control "public, immutable";`.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|map)$ {
        expires -1;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}