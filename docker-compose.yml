services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: archiweb-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - APP_URL=http://localhost:8080
    # Dev: live sync of host sources — code changes are picked up on the fly.
    # No image rebuild / volume reset needed after editing files.
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - archiweb

  webserver:
    build:
      context: ./docker/nginx
    image: archiweb-nginx:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - archiweb

  # Vite dev server with HMR: edits to resources/js|css are applied live on the
  # page. Laravel picks it up via the `public/hot` file written by the plugin.
  vite:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    image: archiweb-vite:latest
    restart: unless-stopped
    working_dir: /var/www/html
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - APP_URL=http://localhost:8080
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - archiweb

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - archiweb

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - archiweb

volumes:
  pgdata:
  esdata:

networks:
  archiweb:
    driver: bridge