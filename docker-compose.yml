services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                ALPINE_MIRROR: https://mirror.yandex.ru/mirrors/alpine
        image: archiweb-app:latest
        restart: unless-stopped
        env_file: .env

        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - archiweb

    webserver:
        build:
            context: ./docker/nginx
        image: archiweb-nginx:latest
        restart: unless-stopped
        ports:
            - '8080:80'
        volumes:
            - ./:/var/www/html
        depends_on:
            - app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - archiweb

    vite:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        image: archiweb-vite:latest
        restart: unless-stopped
        working_dir: /var/www/html
        env_file: .env
        environment:
            DB_HOST: ${DB_HOST:-db}
            DB_PORT: ${DB_PORT:-5432}
            APP_URL: ${APP_URL:-http://localhost:8080}
        volumes:
            - ./:/var/www/html
        ports:
            - '5173:5173'
        depends_on:
            redis:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        command: sh -c "npm run dev -- --host 0.0.0.0 --port 5173"
        networks:
            - archiweb

    ssr:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        image: archiweb-vite:latest
        restart: unless-stopped
        profiles: ['ssr']
        working_dir: /var/www/html
        env_file: .env
        environment:
            DB_HOST: ${DB_HOST:-db}
            DB_PORT: ${DB_PORT:-5432}
            APP_URL: ${APP_URL:-http://localhost:8080}
            INERTIA_SSR_URL: ${INERTIA_SSR_URL:-http://ssr:13714}
        volumes:
            - ./:/var/www/html
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "php artisan inertia:start-ssr"
        networks:
            - archiweb

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # Local dev cache: no password, matching REDIS_PASSWORD=null in .env
        # (Laravel casts the "null" literal to no-auth, so requirepass "null"
        # would always break the connection).
        command:
            - sh
            - -c
            - >
                exec redis-server
                --maxmemory 256mb
                --maxmemory-policy allkeys-lru
                --save ""
                --appendonly no
        healthcheck:
            test: ['CMD-SHELL', 'redis-cli ping | grep PONG']
            interval: 2s
            timeout: 2s
            retries: 30
            start_period: 3s
        networks:
            - archiweb

    db:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
            POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
                ]
            interval: 2s
            timeout: 3s
            retries: 30
            start_period: 5s
        networks:
            - archiweb

volumes:
    pgdata:

networks:
    archiweb:
        driver: bridge
